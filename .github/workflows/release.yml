name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build the Debian trixie image
        run: docker build -f docker/Dockerfile -t type-p-alpha-build:release .
      - name: Configure, build and test
        run: |
          docker run --rm -v "$PWD:/work" -w /work type-p-alpha-build:release sh -c '
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld &&
            cmake --build build &&
            ctest --test-dir build --output-on-failure \
              -E "linux_daws|plugin_editor_snapshot|plugin_editor_snapshot_diff"'
      - name: Package
        run: |
          mkdir -p dist/licences
          cp -r "build/plugin/juce/type_p_alpha_artefacts/Release/VST3/Type P.alpha.vst3" dist/
          cp "build/plugin/juce/type_p_alpha_artefacts/Release/CLAP/Type P.alpha.clap" dist/
          cp "build/plugin/juce/type_p_alpha_artefacts/Release/Standalone/Type P.alpha" dist/
          cp LICENSE LICENSING.md dist/
          cp third-party-licenses/*.txt dist/licences/
          cd dist
          zip -r "../Type-P.alpha-${{ matrix.platform }}.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: Type-P.alpha-${{ matrix.platform }}.zip

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: .\windows\build.ps1
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\licences | Out-Null
          Copy-Item "build/windows-clangcl-lld/plugin/juce/type_p_alpha_artefacts/Release/VST3/Type P.alpha.vst3" dist -Recurse
          Copy-Item "build/windows-clangcl-lld/plugin/juce/type_p_alpha_artefacts/Release/CLAP/Type P.alpha.clap" dist
          Copy-Item "build/windows-clangcl-lld/plugin/juce/type_p_alpha_artefacts/Release/Standalone/Type P.alpha.exe" dist
          Copy-Item LICENSE,LICENSING.md dist
          Copy-Item third-party-licenses\*.txt dist\licences
          Compress-Archive -Path dist\* -DestinationPath Type-P.alpha-windows-x86_64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: Type-P.alpha-windows-x86_64.zip

  macos-universal:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build
      - name: Test
        run: >
          ctest --test-dir build --output-on-failure
          -E "linux_daws|plugin_editor_snapshot|plugin_editor_snapshot_diff"
      - name: Check the universal slices
        run: |
          set -e
          check() {
            archs=$(lipo -archs "$1")
            echo "$1: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "release: $1 is not universal"; exit 1 ;;
            esac
          }
          for bin in \
            "build/plugin/juce/type_p_alpha_artefacts/Release/VST3/Type P.alpha.vst3/Contents/MacOS/Type P.alpha" \
            "build/plugin/juce/type_p_alpha_artefacts/Release/Standalone/Type P.alpha.app/Contents/MacOS/Type P.alpha"; do
            if [ ! -f "$bin" ]; then echo "release: missing $bin"; exit 1; fi
            check "$bin"
          done
          clap=$(find "build/plugin/juce/type_p_alpha_artefacts/Release/CLAP" \
            -type f -name "Type P.alpha*" -print -quit)
          if [ -z "$clap" ]; then echo "release: missing CLAP"; exit 1; fi
          check "$clap"
      - name: Download the validators
        run: |
          curl -fsSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip -d pluginval
          curl -fsSL -o clap-validator.zip \
            https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-macos-15-x86_64.zip
          unzip -q clap-validator.zip -d clap-validator
      - name: Validate the macOS plugin
        run: |
          pluginval=$(find pluginval -type f -name pluginval | head -n 1)
          clap=$(find clap-validator -type f -name clap-validator | head -n 1)
          chmod +x "$pluginval" "$clap"
          "$pluginval" --validate \
            "build/plugin/juce/type_p_alpha_artefacts/Release/VST3/Type P.alpha.vst3" \
            --strictness-level 5 --skip-gui-tests
          "$clap" validate --only-failed \
            "build/plugin/juce/type_p_alpha_artefacts/Release/CLAP/Type P.alpha.clap"
      - name: Package
        run: |
          mkdir -p dist/licences
          cp -R "build/plugin/juce/type_p_alpha_artefacts/Release/VST3/Type P.alpha.vst3" dist/
          cp -R "build/plugin/juce/type_p_alpha_artefacts/Release/CLAP/Type P.alpha.clap" dist/
          cp -R "build/plugin/juce/type_p_alpha_artefacts/Release/Standalone/Type P.alpha.app" dist/
          cp LICENSE LICENSING.md dist/
          cp third-party-licenses/*.txt dist/licences/
          cd dist
          zip -r "../Type-P.alpha-macos-universal.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: Type-P.alpha-macos-universal.zip

  release:
    needs: [linux, windows, macos-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Source archive
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix=type-p-alpha-${TAG}/ \
            -o type-p-alpha-${TAG}-source.tar.gz HEAD
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            artifacts/**/*.zip
            type-p-alpha-*-source.tar.gz
