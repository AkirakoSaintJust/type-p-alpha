name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build the Debian trixie image
        run: docker build -f docker/Dockerfile -t type-p-alpha-build:ci .
      - name: Configure, build and test
        run: |
          docker run --rm -v "$PWD:/work" -w /work type-p-alpha-build:ci sh -c '
            cmake -S . -B build/linux-amd64-clang -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld &&
            cmake --build build/linux-amd64-clang &&
            ctest --test-dir build/linux-amd64-clang --output-on-failure -E linux_daws'

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: .\windows\build.ps1

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build
      - name: Test
        run: >
          ctest --test-dir build --output-on-failure
          -E "linux_daws|plugin_editor_snapshot|plugin_editor_snapshot_diff"
      - name: Check the universal slices
        run: |
          set -e
          check() {
            archs=$(lipo -archs "$1")
            echo "$1: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "ci: $1 is not universal"; exit 1 ;;
            esac
          }
          for bin in \
            "build/plugin/juce/type_p_alpha_artefacts/Release/VST3/Type P.alpha.vst3/Contents/MacOS/Type P.alpha" \
            "build/plugin/juce/type_p_alpha_artefacts/Release/Standalone/Type P.alpha.app/Contents/MacOS/Type P.alpha"; do
            if [ ! -f "$bin" ]; then echo "ci: missing $bin"; exit 1; fi
            check "$bin"
          done
          clap=$(find "build/plugin/juce/type_p_alpha_artefacts/Release/CLAP" \
            -type f -name "Type P.alpha*" -print -quit)
          if [ -z "$clap" ]; then echo "ci: missing CLAP"; exit 1; fi
          check "$clap"
      - name: Download the validators
        run: |
          curl -fsSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip -d pluginval
          curl -fsSL -o clap-validator.zip \
            https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-macos-15-x86_64.zip
          unzip -q clap-validator.zip -d clap-validator
      - name: Validate the macOS plugin
        run: |
          pluginval=$(find pluginval -type f -name pluginval | head -n 1)
          clap=$(find clap-validator -type f -name clap-validator | head -n 1)
          chmod +x "$pluginval" "$clap"
          "$pluginval" --validate \
            "build/plugin/juce/type_p_alpha_artefacts/Release/VST3/Type P.alpha.vst3" \
            --strictness-level 5
          "$clap" validate --only-failed \
            "build/plugin/juce/type_p_alpha_artefacts/Release/CLAP/Type P.alpha.clap"
