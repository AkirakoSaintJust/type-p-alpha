name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build the Debian trixie image
        run: docker build -f docker/Dockerfile -t type-p-alpha-build:ci .
      - name: Configure, build and test
        run: |
          docker run --rm -v "$PWD:/work" -w /work type-p-alpha-build:ci sh -c '
            cmake -S . -B build/linux-amd64-clang -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld &&
            cmake --build build/linux-amd64-clang &&
            ctest --test-dir build/linux-amd64-clang --output-on-failure -E linux_daws'
      - name: Bench the baseline engine
        run: |
          docker run --rm -v "$PWD:/work" -w /work type-p-alpha-build:ci sh -c '
            ./build/linux-amd64-clang/plugin/phase_map | tail -4 &&
            ./build/linux-amd64-clang/plugin/spectral_bench | tail -6'
      - name: Build and bench the AVX2 engine
        run: |
          docker run --rm -v "$PWD:/work" -w /work type-p-alpha-build:ci sh -c '
            cmake -S . -B build/linux-avx2 -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_C_FLAGS=-march=haswell \
              -DCMAKE_CXX_FLAGS=-march=haswell \
              -DFETCHCONTENT_SOURCE_DIR_JUCE=/work/build/linux-amd64-clang/_deps/juce-src \
              -DFETCHCONTENT_SOURCE_DIR_CLAP-JUCE-EXTENSIONS=/work/build/linux-amd64-clang/_deps/clap-juce-extensions-src \
              -DFETCHCONTENT_FULLY_DISCONNECTED=ON &&
            cmake --build build/linux-avx2 --target phase_map spectral_bench engine_parity -j 4 &&
            ./build/linux-avx2/plugin/engine_parity >/dev/null &&
            ./build/linux-avx2/plugin/phase_map | tail -4 &&
            ./build/linux-avx2/plugin/spectral_bench | tail -6'

  sanitizers:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build the Debian trixie image
        run: docker build -f docker/Dockerfile -t type-p-alpha-build:ci .
      - name: Build and test under ThreadSanitizer
        run: |
          docker run --rm --security-opt seccomp=unconfined -v "$PWD:/work" -w /work type-p-alpha-build:ci sh -c '
            cmake -S . -B build/linux-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DP1_SANITIZERS=thread &&
            cmake --build build/linux-tsan --target engine_parity preset_smoke rate_bridge_test &&
            TSAN_OPTIONS=halt_on_error=1 ctest --test-dir build/linux-tsan \
              --output-on-failure -R "engine_parity|preset_smoke|rate_bridge"'
      - name: Build and test under AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          docker run --rm --security-opt seccomp=unconfined -v "$PWD:/work" -w /work type-p-alpha-build:ci sh -c '
            cmake -S . -B build/linux-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DP1_SANITIZERS=address,undefined &&
            cmake --build build/linux-asan -j 4 &&
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              ctest --test-dir build/linux-asan --output-on-failure \
                -E "linux_daws|plugin_editor_snapshot|plugin_editor_snapshot_diff" &&
            # JUCE keeps global allocations until process exit, so the
            # snapshot LeakSanitizer report is not a product leak. The memory
            # and undefined-behaviour checks stay on for it.
            ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              ctest --test-dir build/linux-asan --output-on-failure \
                -R "^plugin_editor_snapshot$"'

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: .\windows\build.ps1
      - name: Build and test the modern AVX2 build
        run: .\windows\build.ps1 -Modern
      - name: Bench the baseline and AVX2 engines
        run: .\windows\bench-isa.ps1

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build
      - name: Test
        run: >
          ctest --test-dir build --output-on-failure
          -E "linux_daws|plugin_editor_snapshot|plugin_editor_snapshot_diff"
      - name: Check the universal slices
        run: |
          set -e
          check() {
            archs=$(lipo -archs "$1")
            echo "$1: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "ci: $1 is not universal"; exit 1 ;;
            esac
          }
          for bin in \
            "build/plugin/juce/type_p_alpha_artefacts/Release/VST3/Type P.alpha.vst3/Contents/MacOS/Type P.alpha" \
            "build/plugin/juce/type_p_alpha_artefacts/Release/Standalone/Type P.alpha.app/Contents/MacOS/Type P.alpha"; do
            if [ ! -f "$bin" ]; then echo "ci: missing $bin"; exit 1; fi
            check "$bin"
          done
          clap=$(find "build/plugin/juce/type_p_alpha_artefacts/Release/CLAP" \
            -type f -name "Type P.alpha*" -print -quit)
          if [ -z "$clap" ]; then echo "ci: missing CLAP"; exit 1; fi
          check "$clap"
      - name: Download the validators
        run: |
          curl -fsSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip -d pluginval
          curl -fsSL -o clap-validator.zip \
            https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-macos-15-x86_64.zip
          unzip -q clap-validator.zip -d clap-validator
          tar -xzf clap-validator/*.tar.gz -C clap-validator
      - name: Validate the macOS plugin
        run: |
          pluginval=$(find pluginval -type f -name pluginval | head -n 1)
          clap=$(find clap-validator -type f -name clap-validator | head -n 1)
          chmod +x "$pluginval" "$clap"
          "$pluginval" --validate \
            "build/plugin/juce/type_p_alpha_artefacts/Release/VST3/Type P.alpha.vst3" \
            --strictness-level 5 --skip-gui-tests
          "$clap" validate --only-failed \
            "build/plugin/juce/type_p_alpha_artefacts/Release/CLAP/Type P.alpha.clap"

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build the arm64 Debian trixie image
        run: docker build -f docker/Dockerfile -t type-p-alpha-build:ci .
      - name: Configure, build and test
        run: |
          docker run --rm -v "$PWD:/work" -w /work type-p-alpha-build:ci sh -c '
            cmake -S . -B build/linux-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld &&
            cmake --build build/linux-arm64 &&
            ctest --test-dir build/linux-arm64 --output-on-failure \
              -E "linux_daws|plugin_editor_snapshot|plugin_editor_snapshot_diff"'
      - name: Bench the arm64 engine
        run: |
          docker run --rm -v "$PWD:/work" -w /work type-p-alpha-build:ci sh -c '
            ./build/linux-arm64/plugin/phase_map | tail -4 &&
            ./build/linux-arm64/plugin/spectral_bench | tail -6'
      - name: Build and bench the native-CPU arm64 engine
        run: |
          docker run --rm -v "$PWD:/work" -w /work type-p-alpha-build:ci sh -c '
            cmake -S . -B build/linux-arm64-native -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld \
              -DCMAKE_C_FLAGS=-mcpu=native \
              -DCMAKE_CXX_FLAGS=-mcpu=native \
              -DFETCHCONTENT_SOURCE_DIR_JUCE=/work/build/linux-arm64/_deps/juce-src \
              -DFETCHCONTENT_SOURCE_DIR_CLAP-JUCE-EXTENSIONS=/work/build/linux-arm64/_deps/clap-juce-extensions-src \
              -DFETCHCONTENT_FULLY_DISCONNECTED=ON &&
            cmake --build build/linux-arm64-native --target phase_map spectral_bench engine_parity -j 4 &&
            ./build/linux-arm64-native/plugin/engine_parity >/dev/null &&
            ./build/linux-arm64-native/plugin/phase_map | tail -4 &&
            ./build/linux-arm64-native/plugin/spectral_bench | tail -6'
