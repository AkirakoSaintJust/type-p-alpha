<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type P.alpha: spectrum card proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Unbounded:wght@400;700&family=Zen+Dots&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #050505; }
  body {
    display: flex; align-items: flex-start; justify-content: center;
    padding: 18px;
  }
  .frame {
    position: relative; width: 1240px; height: auto; background: var(--p1-bg);
    color: var(--p1-text); font-family: var(--p1-font-ui);
    border: 1px solid var(--p1-line-strong);
    overflow: hidden;
  }
  .frame::before, .frame::after {
    content: ""; position: absolute; width: 11px; height: 11px;
    border: 2px solid var(--p1-pink); z-index: 5;
  }
  .frame::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
  .frame::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }

  .top { height: 118px; padding: 14px 16px 0; display: flex; gap: 20px; }
  .brand {
    font-family: var(--p1-font-display); font-size: 34px; line-height: 1;
    color: var(--p1-brand-ink); white-space: nowrap;
  }
  .brand .dot { color: var(--p1-pink); }
  .brand .a { font-family: "Unbounded", var(--p1-font-display); font-size: 30px; }
  .note {
    margin-top: 8px; font-size: 11px; color: var(--p1-dim);
    letter-spacing: .04em;
  }
  .proposal {
    font-family: var(--p1-font-display); font-size: 12px; color: var(--p1-pink);
    letter-spacing: .08em; text-transform: uppercase;
  }
  .top-right { margin-left: auto; display: flex; flex-direction: column;
    align-items: stretch; gap: 2px; width: 236px; }
  .loaded-label { font-family: var(--p1-font-display); font-size: 10px;
    color: var(--p1-dim); letter-spacing: .04em; }
  .loaded-name { font-size: 13px; color: var(--p1-white); }
  .loaded-buttons { display: flex; gap: 6px; margin-top: 6px; }

  .btn {
    height: 22px; padding: 0 9px; display: inline-flex; align-items: center;
    justify-content: center; background: var(--p1-bg);
    border: 1px solid var(--p1-line-strong); color: var(--p1-dim);
    font-family: var(--p1-font-ui); font-size: 11px; white-space: nowrap;
  }
  .btn.small { height: 18px; padding: 0 7px; font-size: 10px; }
  .btn.key { color: var(--p1-text); }

  .tabs {
    height: 37px; display: flex; align-items: stretch; padding-left: 4px;
    border-top: 1px solid var(--p1-line-strong);
    border-bottom: 1px solid var(--p1-line-strong);
  }
  .tab {
    display: flex; align-items: center; padding: 0 15px; color: var(--p1-dim);
    font-family: var(--p1-font-ui); font-size: 13px; white-space: nowrap;
  }
  .tab.active {
    color: #000; background: var(--p1-pink);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    padding: 0 20px;
  }

  .page {
    height: 685px; padding: 6px 17px 0; display: flex; flex-direction: column;
    gap: 6px;
  }
  .ops { height: 164px; display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; }
  .op {
    display: flex; flex-direction: column; min-width: 0;
  }
  .ophead { height: 24px; display: flex; align-items: center; gap: 8px; }
  .opname { font-family: var(--p1-font-display); font-size: 14px;
    color: var(--p1-white); letter-spacing: .04em; }
  .opname.car { color: var(--p1-pink); }
  .opacts { margin-left: auto; display: flex; gap: 5px; align-items: center; }
  .mute { display: flex; align-items: center; gap: 4px; font-size: 10px;
    color: var(--p1-pink); }
  .mute i { display: block; width: 12px; height: 12px;
    border: 1px solid var(--p1-pink); }
  .mute i.on { background: var(--p1-pink); }
  .opvis { height: 30px; display: flex; gap: 6px; margin-bottom: 3px; }
  .opvis div { flex: 1; border: 1px solid var(--p1-line); background: #000;
    position: relative; overflow: hidden; }
  .opvis svg { width: 100%; height: 100%; display: block; }
  .osc { flex: 1; background: var(--p1-panel); padding: 5px 8px;
    display: flex; flex-direction: column; }
  .osc-head { height: 14px; display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--p1-dim); }
  .osc-head .title { color: var(--p1-white); }
  .osc-head .title::before { content: "// "; color: var(--p1-pink); }
  .osc-head .acts { margin-left: auto; display: flex; gap: 4px; }
  .knobs { display: flex; justify-content: space-between; margin-top: 3px; }
  .knob { width: 40px; text-align: center; }
  .dial { width: 28px; height: 28px; margin: 0 auto 1px; border-radius: 50%;
    border: 3px solid #2a2a2a; position: relative; }
  .dial::after { content: ""; position: absolute; left: 50%; top: 1px;
    width: 2px; height: 11px; background: var(--p1-white);
    transform: translateX(-50%) rotate(-35deg); transform-origin: bottom; }
  .dial.lit { border-top-color: var(--p1-pink); }
  .kname { font-size: 9px; color: var(--p1-dim); }
  .kval { font-size: 10px; color: var(--p1-pink-bright); }
  .wavesel { margin-top: 2px; height: 16px; width: 150px; border: 1px solid
    var(--p1-line-strong); background: var(--p1-bg); color: var(--p1-text);
    font-size: 10px; display: flex; align-items: center; padding: 0 6px;
    justify-content: space-between; }
  .wavesel::after { content: "\25BE"; color: var(--p1-dim); }

  .cards { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .spcard {
    height: 124px; display: flex; flex-direction: column;
    background: var(--p1-panel);
  }
  .sphead { height: 22px; display: flex; align-items: center; padding: 0 8px;
    gap: 6px; }
  .sptitle { font-size: 11px; color: var(--p1-white); white-space: nowrap; }
  .sptitle::before { content: "// "; color: var(--p1-pink); }
  .spacts { margin-left: auto; display: flex; align-items: center; gap: 5px; }
  .spacts .lbl { font-size: 9px; color: var(--p1-dim); }
  .spacts .hgroup { display: flex; align-items: center; gap: 5px; }
  .spacts .seg.compact span { width: 38px; height: 18px; }
  .spacts .sel.selection { width: 104px; }
  .spacts .sel.group-sel { width: 124px; }
  .sel { height: 18px; border: 1px solid var(--p1-line-strong);
    background: var(--p1-bg); color: var(--p1-text); font-size: 10px;
    display: inline-flex; align-items: center; gap: 8px; padding: 0 6px; }
  .sel::after { content: "\25BE"; color: var(--p1-dim); font-size: 8px; }
  .spbody { flex: 1; display: flex; gap: 8px; padding: 0 8px 4px; min-height: 0; }
  .spot { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .spbars { flex: 1; display: flex; gap: 2px; padding: 3px; background: #000;
    border: 1px solid #141414; position: relative; }
  .sbar { flex: 1; background: #0b0b0b; border: 1px solid #1b1b1b;
    position: relative; }
  .sbar i { position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: var(--p1-purple); }
  .sbar.b i { background: var(--p1-pink); }
  .sbar.in-group { border-color: var(--p1-green); }
  .sbar.outside { background: #050505; border-color: #111; }
  .sbar.outside i { background: #2a2a2a; }
  .splabels { height: 12px; display: flex; gap: 2px; padding: 0 3px; }
  .splabels span { flex: 1; font-size: 8px; color: var(--p1-dim);
    text-align: center; overflow: visible; white-space: nowrap; }
  .splabels span.in-group { color: var(--p1-green); }
  .splegend { height: 12px; font-size: 9px; color: var(--p1-dim);
    padding-left: 3px; white-space: nowrap; overflow: hidden; }
  .splegend b { color: var(--p1-green); font-weight: normal; }
  .spcontrols { width: 280px; display: flex; flex-direction: column;
    padding-top: 6px; }
  .ctlrow { height: 16px; display: flex; align-items: center; gap: 6px;
    font-size: 9px; color: var(--p1-dim); }
  .ctlrow .lbl { width: 40px; }
  .ctlrow .sel { flex: 1; }
  .seg { display: flex; flex: 1; }
  .seg span { flex: 1; height: 16px; display: flex; align-items: center;
    justify-content: center; border: 1px solid var(--p1-line-strong);
    color: var(--p1-dim); font-size: 9px; }
  .seg span + span { border-left: 0; }
  .seg span.on { border-color: var(--p1-green); color: var(--p1-green); }
  .springs { flex: 1; display: flex; gap: 6px; min-height: 0; align-items: center; }
  .spring { flex: 1; display: flex; flex-direction: column; align-items: center;
    min-width: 0; }
  .track { width: 16px; height: 64px; border: 1px solid var(--p1-line-strong);
    position: relative; background: #0b0b0b; }
  .track::before { content: ""; position: absolute; left: 2px; right: 2px;
    top: 50%; border-top: 1px solid #3a3a3a; }
  .track i { position: absolute; left: 2px; width: 10px; height: 4px;
    top: calc(50% - 2px); background: var(--p1-pink); }
  .sname { font-size: 9px; color: var(--p1-dim); margin-top: 1px; }
  .sval { font-size: 9px; color: var(--p1-pink-bright); }
  .formant-sel { height: 16px; min-width: 54px; border: 1px solid
    var(--p1-line-strong); font-size: 9px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 4px; color: var(--p1-text); }
  .formant-cell { flex: 1.7; display: flex; align-items: flex-end;
    justify-content: center; gap: 6px; min-width: 0; }
  .formant-picker { margin-bottom: 5px; }

  .status { height: 24px; display: flex; align-items: center; gap: 16px;
    padding: 0 16px; border-top: 1px solid var(--p1-line); font-size: 10px;
    color: var(--p1-dim); }
  .status i { display: inline-block; width: 8px; height: 8px; margin-right: 5px;
    border: 1px solid var(--p1-green); }
  .annot { color: var(--p1-faint); margin-left: auto; font-size: 10px; }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div>
      <div class="brand">type P<span class="dot">.</span><span class="a">a</span></div>
      <div class="note">p1onken // パンク派第１音響合成研究班</div>
      <div class="proposal" style="margin-top:10px">layout proposal · all selectors in the header</div>
    </div>
    <div class="top-right">
      <span class="loaded-label">loaded multi-patch:</span>
      <span class="loaded-name">init patch</span>
      <div class="loaded-buttons">
        <span class="btn key" style="flex:1">multi-patch library...</span>
        <span class="btn">rename</span>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <span class="tab">patch settings</span>
    <span class="tab">part fx/mod</span>
    <span class="tab">operator envs</span>
    <span class="tab">operator lfos</span>
    <span class="tab active">op spectra a</span>
    <span class="tab">op spectra b</span>
    <span class="tab">op spectra mod</span>
  </nav>

  <main class="page">
    <section class="ops" id="ops"></section>
    <section class="cards" id="cards"></section>
  </main>

  <footer class="status">
    <span><i></i>midi</span><span><i></i>sync</span>
    <span class="annot">each card: bars left, controls right, all in 124 px</span>
  </footer>
</div>

<script>
  const OP_NAMES = ["op1", "op2", "op3", "op4"];
  const STATES = [
    { group: "third P5", mask: "both", selection: "edit 33-64", first: 1, wave: "sine" },
    { group: "all", mask: "live", selection: "edit 1-32", first: 1, wave: "sine" },
    { group: "odd", mask: "dead", selection: "edit 1-16", first: 1, wave: "sine" },
    { group: "all", mask: "both", selection: "edit 1-64", first: 1, wave: "sine" },
  ];
  /* the seven windows as offsets into the 1-64 range */
  const WINDOWS = {
    "edit 1-64": [0, 63], "edit 1-32": [0, 31], "edit 33-64": [32, 63],
    "edit 1-16": [0, 15], "edit 17-32": [16, 31], "edit 33-48": [32, 47],
    "edit 49-64": [48, 63],
  };
  const GROUP_TEST = {
    "all": () => true,
    "odd": (h) => h >= 3 && h % 2 === 1,
    "third P5": (h) => { let v = 3; while (v <= 64) { if (v === h) return true; v *= 2; } return false; },
  };

  function spectrum(op) {
    const levels = [];
    for (let h = 1; h <= 64; ++h) {
      if (op === 0) levels.push(Math.max(0, Math.round(
        62 * Math.exp(-Math.pow(h - 48, 2) / 90) + 36 / Math.pow(h, 0.5))));
      else if (op === 1) levels.push(Math.max(0, Math.round(
        99 * Math.exp(-Math.pow(h - 5, 2) / 10) + 22 / h)));
      else if (op === 2) levels.push(h % 2 === 1 ? Math.round(90 / Math.pow(h, 0.8)) : 0);
      else levels.push(Math.max(0, Math.round(70 / Math.pow(h, 0.55) * (h < 40 ? 1 : 0.3))));
    }
    return levels;
  }

  function knob(name, value, lit) {
    return `<div class="knob"><div class="dial${lit ? " lit" : ""}"></div>
      <div class="kname">${name}</div><div class="kval">${value}</div></div>`;
  }

  function opStrip(op) {
    const name = OP_NAMES[op];
    const wave = op === 0 ? "saw" : "sine";
    return `<div class="op">
      <div class="ophead">
        <span class="opname ${op === 0 || op === 2 ? "car" : ""}">${name}</span>
        <span class="opacts">
          <span class="btn small">copy</span><span class="btn small">paste</span>
        </span>
        <span class="mute" style="margin-left:8px"><span>active</span><i class="on"></i>mute</span>
      </div>
      <div class="opvis">
        <div><svg viewBox="0 0 120 40" preserveAspectRatio="none">
          <path d="M0 20 C 8 4, 16 36, 24 20 S 40 4, 48 20 S 64 36, 72 20 S 88 4, 96 20 S 112 36, 120 20"
            fill="none" stroke="#3dff9e" stroke-width="1.4"/></svg></div>
        <div>${Array.from({ length: 24 }, (_, i) =>
          `<span style="position:absolute;bottom:4px;left:${i * 4 + 2}px;width:2px;height:${6 + (i * 7) % 16}px;background:${i % 5 === 0 ? "#c780ff" : "#ff2e7e"}"></span>`).join("")}</div>
      </div>
      <div class="osc">
        <div class="osc-head"><span class="title">oscillator</span>
          <span class="acts"><span class="btn small">copy</span><span class="btn small">paste</span></span>
        </div>
        <div class="knobs">
          ${knob("ratio", "1.00", false)}
          ${knob("detune", "0c", false)}
          ${knob("level", "75", true)}
          ${knob("feedback", "0%", true)}
          ${knob("morph", "0", true)}
        </div>
        <div class="wavesel">${wave}</div>
      </div>
    </div>`;
  }

  function cards() {
    return STATES.map((state, op) => {
      const levels = spectrum(op);
      const [lo, hi] = WINDOWS[state.selection];
      const test = GROUP_TEST[state.group];
      const mark = state.group !== "all";
      const bars = levels.map((level, i) => {
        const outside = i < lo || i > hi;
        const member = mark && test(i + 1);
        return `<div class="sbar${outside ? " outside" : ""}${member ? " in-group" : ""}">
          <i style="height:${level}%"></i></div>`;
      }).join("");
      const labels = levels.map((_, i) => {
        const h = i + 1;
        const show = i % 8 === 0 || i === 63;
        return `<span class="${mark && test(h) ? "in-group" : ""}">${show ? h : ""}</span>`;
      }).join("");
      const members = mark
        ? Array.from({ length: 64 }, (_, i) => i + 1).filter((h) => test(h)).slice(0, 6).join(" ")
        : "64 members";
      return `<section class="spcard">
        <div class="sphead">
          <span class="sptitle">${OP_NAMES[op]} spectrum a</span>
          <span class="spacts">
            <span class="lbl">range</span><span class="sel">1-64</span>
            <span class="hgroup"><span class="lbl">mask</span><span class="seg compact">
              <span class="${state.mask === "live" ? "on" : ""}">live</span>
              <span class="${state.mask === "dead" ? "on" : ""}">dead</span>
              <span class="${state.mask === "both" ? "on" : ""}">both</span>
            </span></span>
            <span class="hgroup"><span class="lbl">selection</span><span class="sel selection">${state.selection}</span></span>
            <span class="hgroup"><span class="lbl">group</span><span class="sel group-sel">${state.group}</span></span>
            <span class="btn">load spectrum template...</span>
            <span class="btn">norm</span><span class="btn">to b</span>
            <span class="btn">copy</span><span class="btn">paste</span>
          </span>
        </div>
        <div class="spbody">
          <div class="spot">
            <div class="spbars">${bars}</div>
            <div class="splabels">${labels}</div>
            <div class="splegend">${state.group} · ${state.mask} · ${state.selection} · <b>${members}</b></div>
          </div>
          <div class="spcontrols">
            <div class="springs">
              <div class="spring"><div class="track"><i></i></div><span class="sname">tilt</span><span class="sval">0%</span></div>
              <div class="spring"><div class="track"><i></i></div><span class="sname">level</span><span class="sval">0%</span></div>
              <div class="formant-cell">
                <div class="spring"><div class="track"><i></i></div><span class="sname">formant</span><span class="sval">0%</span></div>
                <div class="formant-picker"><span class="formant-sel">h5 <span style="color:#7d7d7d">▾</span></span></div>
              </div>
            </div>
          </div>
        </div>
      </section>`;
    }).join("");
  }

  document.getElementById("ops").innerHTML = [0, 1, 2, 3].map(opStrip).join("");
  document.getElementById("cards").innerHTML = cards();
</script>
</body>
</html>
